name: OHOS buildenv smoke

# Builds this commit's unsigned hap in the same container image the release job
# uses, then stops: no release is created, touched or uploaded. It exists so a
# republished image (`ci/publish-buildenv.sh`) can be proven on a real runner
# against a real checkout before a release depends on it:
#
#   gh workflow run ohos-buildenv-smoke.yml --ref <branch>
#
# The tag below and `container.image` in ohos-release.yml must name the same
# image; bump both when the toolchain changes. `container.image` cannot read a
# repository variable or an `env:` entry — only the github/needs/strategy/matrix/
# vars/inputs contexts — so the literal is unavoidable, and this file is the
# second copy of it on purpose rather than a release-only gamble.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build unsigned hap (no release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The container's default shell is sh, which does not know `pipefail`.
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/hezebang/techpie-ohos-buildenv:26.0.0.851-3.27.5-ohos-1.0.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          set -euo pipefail

          missing=()
          for tool in flutter hvigorw ohpm node java; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            echo "::error::This image is missing: ${missing[*]}. Rebuild it with ci/publish-buildenv.sh and point both workflows at the new tag."
            exit 1
          fi

          flutter --version
          hvigorw --version
          ohpm --version || true
          node --version
          java -version 2>&1 | head -1
          df -h /workspace | tail -1

      # Same two commands as the release job, so passing here means the image and
      # this commit build a hap together.
      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned hap
        run: scripts/build-unsigned-hap.sh

      - name: Report the artifact
        run: |
          set -euo pipefail
          ls -l dist/
          unzip -l dist/*.hap | head -10
