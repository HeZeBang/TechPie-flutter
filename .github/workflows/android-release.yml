name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Android release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release request
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_TAG" =~ ^android-v([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Invalid Android release tag: $REQUESTED_TAG"
            echo "Expected format: android-vX.Y.Z+B"
            exit 1
          fi
          build_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          build_number="${BASH_REMATCH[4]}"

          tag_sha="$(git rev-list -n 1 "$REQUESTED_TAG")"
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "::error::Release tag must point to a commit reachable from master."
            exit 1
          fi

          {
            echo "TAG_NAME=$REQUESTED_TAG"
            echo "BUILD_NAME=$build_name"
            echo "BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing android-release environment secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi

          umask 077
          keystore_path="$RUNNER_TEMP/techpie-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed ARM64 APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing android-release environment secret: $secret_name"
              exit 1
            fi
          done

          flutter build apk \
            --release \
            --no-pub \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Verify signature and collect APK
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: club.geekpie.techpie
          EXPECTED_CERT_SHA256: 1c8155ee7940f2bef76816f24fce3044a7a083ed2032bb9dcef3de7be4284a98
        run: |
          set -euo pipefail

          mkdir -p dist
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$apksigner"

          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apk_application_id="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [[ "$apk_application_id" != "$EXPECTED_APPLICATION_ID" ]]; then
            echo "::error::APK application ID does not match the production application ID."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          apk_cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sed -n '1p' | tr '[:upper:]' '[:lower:]')"
          if [[ "$apk_cert" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signing certificate does not match the production certificate."
            exit 1
          fi
          cp "$apk" "dist/TechPie-${TAG_NAME}-arm64.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: TechPie-${{ env.TAG_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
