name: Dispatch iOS Release

on:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="$GITHUB_REF_NAME"
          if [[ ! "$TAG_NAME" =~ ^ios-v([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$ ]]; then
            echo "Invalid iOS release tag: $TAG_NAME"
            echo "Expected format: ios-vX.Y.Z+B"
            exit 1
          fi

          BUILD_NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          BUILD_NUMBER="${BASH_REMATCH[4]}"
          TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"

          git fetch --no-tags origin main:refs/remotes/origin/main || true
          git fetch --no-tags origin master:refs/remotes/origin/master || true

          reachable=false
          for branch in origin/main origin/master; do
            if git rev-parse --verify --quiet "$branch" >/dev/null; then
              if git merge-base --is-ancestor "$TAG_SHA" "$branch"; then
                reachable=true
                break
              fi
            fi
          done

          if [[ "$reachable" != "true" ]]; then
            echo "Release tag must point to a commit reachable from main or master."
            exit 1
          fi

          {
            echo "BUILD_NAME=$BUILD_NAME"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "TAG_SHA=$TAG_SHA"
          } >> "$GITHUB_ENV"

      - name: Dispatch private release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          payload="$(
            jq -n \
              --arg event_type "ios_release_tag" \
              --arg source_repo "HeZeBang/TechPie-flutter" \
              --arg tag "$GITHUB_REF_NAME" \
              --arg sha "$TAG_SHA" \
              --arg build_name "$BUILD_NAME" \
              --arg build_number "$BUILD_NUMBER" \
              '{
                event_type: $event_type,
                client_payload: {
                  source_repo: $source_repo,
                  tag: $tag,
                  sha: $sha,
                  build_name: $build_name,
                  build_number: $build_number
                }
              }'
          )"

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/CNDY1390/TechPie-release/dispatches \
            -d "$payload"
