name: Analyze

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: analyze-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      # The pub cache, defined once in .github/actions/pub-cache. Read-only: the
      # review workflows do not own a copy of any key.
      - uses: ./.github/actions/pub-cache

      - name: Install dependencies
        # The committed lock resolves through the China mirror (see .envrc), so
        # the drift check below compares against the same host.
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get

      - name: Verify dependency graph
        shell: bash
        run: git diff --exit-code -- pubspec.lock

      - name: Lint the workflows
        # The release pipeline is wiring, so lint it: this catches a
        # `needs.<job>.outputs.<name>` nobody declared (which reads as an empty
        # string at runtime, so it breaks the release rather than the lint) and
        # shellcheck findings inside step scripts. Pinned by digest so the lint
        # cannot change under us.
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test watch protocol, signing configuration and feedback recovery
        run: node --test harmonyos_watch/scripts/*.test.cjs harmonyos_watch/scripts/*.test.mjs web/feedback/test/*.test.mjs
