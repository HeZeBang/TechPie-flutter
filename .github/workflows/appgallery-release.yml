name: AppGallery Release

# Publishes a release to Huawei AppGallery Connect.
#
# A release's own artifacts stop at GitHub, and they are unsigned on purpose —
# the signature *is* the app's identity, so it stays with the owner rather than
# on a runner. This workflow is the exception that needs it: AppGallery validates
# the signature on upload, so the pack has to be built signed here, from the
# certificate, profile and keystore kept in the `appgallery-release` environment.
#
# The two halves are separate on purpose:
#
#   upload      registering the pack as a draft version. Repeatable — every
#               upload becomes a new software package, and it is invisible to
#               users until someone submits it.
#   submit      putting that version in front of Huawei's reviewers, which is
#               what publishes it. Exposed as a dispatch input (off by default)
#               and, below, as the second lock scripts/appgallery-publish.mjs
#               demands, so a future caller cannot reach it by accident.
#
# Required environment secrets (`appgallery-release`):
#
#   AGC_APP_ID / AGC_CLIENT_ID / AGC_CLIENT_SECRET
#       A *team-level* AGC API client (project N/A, role ≥ APP管理员) — a
#       project-scoped one answers every publishing call with 403.
#   OHOS_CERT_BASE64 / OHOS_PROFILE_BASE64 / OHOS_STORE_BASE64
#       the release `.cer`, `.p7b` and `.p12`, base64-encoded because a secret
#       holds text. The store passwords are the DevEco-encrypted ones .envrc
#       already carries.
#   OHOS_KEY_ALIAS, OHOS_STORE_PASSWORD, OHOS_KEY_PASSWORD
#
# Optional repository variable: OHOS_SIGN_ALG (defaults to SHA256withECDSA,
# which is what DevEco's key generation produces).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v1.0.1+11 (must name a commit on master or a release branch)'
        required: true
        type: string
      submit:
        description: 'Submit for review after uploading — the act that puts this version in front of reviewers'
        required: true
        type: boolean
        default: false
      remark:
        description: 'Optional note attached to the submit call'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  # Per tag, like the platform workflows, and never cancelling: a publish that
  # started has to finish rather than be replaced by a second dispatch.
  group: appgallery-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to AppGallery
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Every secret this job reads is scoped here, so the signing material is not
    # readable by another workflow — including one on a pull request.
    environment: appgallery-release
    # The container's default shell is sh, which does not know `pipefail`.
    defaults:
      run:
        shell: bash
    container:
      # The same toolchain the release builds with; see ohos-release.yml for why
      # it arrives as an image and why this tag is a literal.
      image: ghcr.io/hezebang/techpie-ohos-buildenv:6.1.1.268-3.27.5-ohos-1.0.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      # Same rule the platform workflows apply before they build: the tag must
      # name a commit a reader can find in this repository's history, because a
      # store submission is the least reversible thing the pipeline does.
      - name: Verify the tag is publishable
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! git branch -r --contains "$TAG" --format='%(refname:short)' |
            grep -qE '^origin/(master|release/)'; then
            echo "::error::$TAG is not on master or a release branch; refusing to publish it."
            exit 1
          fi

      - name: Write the signing material
        env:
          CERT_BASE64: ${{ secrets.OHOS_CERT_BASE64 }}
          PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
          STORE_BASE64: ${{ secrets.OHOS_STORE_BASE64 }}
        run: |
          set -euo pipefail

          for name in CERT PROFILE STORE; do
            if [[ -z "${!name_BASE64:-}" ]]; then
              echo "::error::Secret OHOS_${name}_BASE64 is not set in the appgallery-release environment; AppGallery rejects an unsigned pack."
              exit 1
            fi
          done

          mkdir -p ohos/signature
          printf '%s' "$CERT_BASE64" | base64 -d > ohos/signature/release.cer
          printf '%s' "$PROFILE_BASE64" | base64 -d > ohos/signature/release.p7b
          printf '%s' "$STORE_BASE64" | base64 -d > ohos/signature/release.p12
          chmod 600 ohos/signature/*

      # Read-only pub cache, defined once in .github/actions/pub-cache — the same
      # one the OHOS release job uses, and warm for the same reason.
      - uses: ./.github/actions/pub-cache

      - name: Build the signed App Pack
        env:
          TAG: ${{ inputs.tag }}
          # 0 rather than 1: this is the run that has signing material, and the
          # only one whose pack AppGallery will accept.
          OHOS_UNSIGNED: '0'
          OHOS_CERT_PATH: ./signature/release.cer
          OHOS_PROFILE_PATH: ./signature/release.p7b
          OHOS_STORE_FILE: ./signature/release.p12
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_STORE_PASSWORD: ${{ secrets.OHOS_STORE_PASSWORD }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          OHOS_SIGN_ALG: ${{ vars.OHOS_SIGN_ALG || 'SHA256withECDSA' }}
        run: |
          set -euo pipefail

          # The artifact is named after the release, and only the tag knows
          # whether this version line's build is a candidate (CLAUDE.md →
          # Artifact names).
          # Declared, then exported: `export NAME="$(…)"` would mask a failure
          # here, and a tag this script rejects must stop the build rather than
          # leave the artifact unnamed.
          RELEASE_NAME="$(scripts/release-name.sh "$TAG")"
          export RELEASE_NAME

          flutter pub get
          scripts/build-ohos-app.sh
          ls -l dist/*.app

      - name: Publish to AppGallery
        env:
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          # The script's second lock, derived from the input that already asked
          # for a submit. It is here so that adding `--submit` to this step in a
          # later change still cannot publish a version by itself.
          AGC_CONFIRM_SUBMIT: ${{ inputs.submit && 'YES' || 'NO' }}
          REMARK: ${{ inputs.remark }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail

          # No --file: the script resolves the one dist/*-signed.app this job just
          # built, and refuses a pack it can tell is not publishable.
          if [[ "$SUBMIT" == "true" ]]; then
            node scripts/appgallery-publish.mjs --submit --remark "$REMARK"
          else
            node scripts/appgallery-publish.mjs
          fi
