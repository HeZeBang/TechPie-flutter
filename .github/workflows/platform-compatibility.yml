name: Platform compatibility

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            command: build apk --debug --no-pub
          - platform: ios
            os: macos-latest
            command: build ios --release --no-codesign --no-pub
          - platform: macos
            os: macos-latest
            command: build macos --release --no-pub
          - platform: linux
            os: ubuntu-24.04
            command: build linux --release --no-pub
          - platform: windows
            os: windows-2022
            command: build windows --release --no-pub
    defaults:
      run:
        shell: bash
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn

    steps:
      - name: Configure Windows checkout
        if: matrix.platform == 'windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - uses: ./.github/actions/pub-cache

      - name: Resolve locked dependencies
        run: scripts/flutter-upstream.sh pub get --enforce-lockfile

      - name: Verify dependency graph
        run: git diff --exit-code -- pubspec.lock

      - name: Disable macOS signing
        if: matrix.platform == 'macos'
        run: |
          printf 'CODE_SIGNING_ALLOWED = NO\n' > "$RUNNER_TEMP/unsigned.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/unsigned.xcconfig" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/flutter-upstream.sh ${{ matrix.command }}
