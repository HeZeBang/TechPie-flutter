name: techpie
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4-rc.1+19

environment:
  sdk: ">=3.6.2 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  animations: ^2.0.11
  casdoor_flutter_sdk: ^1.0.0
  clock: ">=1.1.1 <1.2.0"
  connectivity_plus: 6.1.4
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  crypto: 3.0.7
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  cupertino_native_better: 1.8.3
  desktop_webview_window: any
  dio: ^5.8.0
  dynamic_color: ">=1.7.0 <1.8.0"
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_secure_storage_ohos: # HarmonyOS 安全存储
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_flutter_secure_storage.git
      path: flutter_secure_storage_ohos
      ref: br_v9.2.2_ohos
  http: ^1.4.0
  image_picker:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: br_image_picker-v1.1.2_ohos
  # The OHOS platform implementations MUST be direct dependencies, not just
  # dependency_overrides: from Flutter 3.41 the tool resolves the plugin
  # registrant from `.dart_tool/package_graph.json`, whose root dependency
  # closure drops override-only packages, so an overridden-only implementation
  # is never registered and its channel throws MissingPluginException. Pinned by
  # commit so a release builds the source it was tested against.
  image_picker_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker_ohos
      ref: 4500f9da7c8223eb92ddc1fc2bff5ada36cf5cbe
  intl: ^0.20.2
  media_kit: 1.2.6
  media_kit_libs_android_video: 1.3.8
  media_kit_libs_ios_video: 1.1.4
  media_kit_libs_macos_video: 1.1.4
  media_kit_libs_windows_video: 1.0.11
  media_kit_video: 1.3.1
  mobile_scanner: ^7.0.1
  open_filex: ^4.5.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.5
  path_provider_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider_ohos
      ref: d8bf2cf9d726cce4d308521f4fb500d832523002
  pointycastle: 4.0.0
  qr_flutter: 4.1.0
  reel_text: ^0.4.3
  screen_brightness: 2.1.11
  shared_preferences: ^2.3.0
  shared_preferences_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_ohos
      ref: 35fb467533e174411a117b2a030c15d2a3a9687c
  url_launcher: ^6.3.0
  url_launcher_ohos:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/url_launcher/url_launcher_ohos
      ref: 35fb467533e174411a117b2a030c15d2a3a9687c
  web: ^1.1.1
  webview_flutter:
    # HeZeBang/br_webview_flutter_ohos: the OHOS fork, plus document-start
    # user-script injection on every platform.
    git:
      url: https://github.com/HeZeBang/br_webview_flutter_ohos.git
      path: webview_flutter
      ref: main

dependency_overrides:
  # iOS tab bar: upstream 1.8.3 plus a fix for the native bar resending every
  # item on its first rebuild (iconSize was never cached at creation).
  # Drop this once that fix ships upstream.
  cupertino_native_better:
    git:
      url: https://github.com/Honahec/cupertino_native_better.git
      ref: 1c01bff23a383e321f86f174753330a5ac7a7f33
  # Linux: use forked desktop_webview_window (WebKitGTK) for webview
  # popup, avoiding WPE WebKit EGL issues on Wayland. The fork adds
  # native setCookie via webkit_cookie_manager_add_cookie and forwards
  # WebKit script messages to Flutter; on Windows, WebView2's CookieManager.
  desktop_webview_window:
    git:
      url: https://github.com/HeZeBang/desktop_webview_window_fork.git
      ref: feature/techpie-bridge

  # The OHOS platform implementations are direct dependencies above, not
  # overrides: the 3.41 tool only scans the root dependency closure, so an
  # override-only implementation is never registered and its channel throws
  # MissingPluginException at boot.
  mobile_scanner:
    # mobile_scanner 7.0.1 with OHOS support and TechPie's preview/Android
    # patches, plus the iPhone 17 pixel-format fix. Apple's Vision backend
    # supports arm64 iOS simulators. Pin the merged upstream commit.
    git:
      url: https://github.com/HeZeBang/mobile_scanner_ohos.git
      ref: 76f6f441ccd82d4c5942c2e79ff25e0719cc90dd
  package_info_plus:
    git:
      url: https://gitee.com/openharmony-sig/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
  # Match Flutter 3.27's Android SDK 35 without raising the host toolchain.
  screen_brightness_android: 2.1.3
  # Newer iOS releases require FlutterSceneLifeCycleDelegate, absent in Flutter 3.27.
  screen_brightness_ios: 2.1.2
  webview_flutter_platform_interface:
    git:
      url: https://github.com/HeZeBang/br_webview_flutter_ohos.git
      path: webview_flutter_platform_interface
      ref: main
  # flutter_secure_storage:
  #   git:
  #     url: https://gitcode.com/openharmony-sig/fluttertpc_flutter_secure_storage.git
  #     path: flutter_secure_storage
  # flutter_secure_storage_platform_interface:
  #   git:
  #     url: https://gitcode.com/openharmony-sig/fluttertpc_flutter_secure_storage.git
  #     path: flutter_secure_storage_platform_interface
  # flutter_secure_storage_ohos:
  #   git:
  #     url: https://gitcode.com/openharmony-sig/fluttertpc_flutter_secure_storage.git
  #     path: flutter_secure_storage_ohos

dev_dependencies:
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  fake_async: ">=1.3.1 <1.4.0"
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  webview_flutter_platform_interface: ^2.13.1

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/campus_card/audio/
    - assets/campus_card/data/
    - assets/campus_card/images/card-full.png
    - assets/campus_card/images/card-top.png
    - assets/campus_card/images/card-bottom.png
    - assets/campus_card/images/network-online.png
    - assets/campus_card/images/network-offline.png
    - assets/campus_card/images/network-warning.png
    - assets/campus_card/images/widget-background.png

  fonts:
    # Roboto Medium, the exact face Telegram Android renders its "bold" UI
    # text with (assets/fonts/rmedium.ttf, Apache-2.0). Bundled so the
    # bottom-bar labels look identical on every platform.
    - family: RobotoMedium
      fonts:
        - asset: assets/fonts/rmedium.ttf
          weight: 500

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
